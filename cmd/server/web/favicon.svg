<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>
  <rect width="192" height="192" rx="44" fill="url(#bg)"/>
  <!-- 北斗七星（璇玑）连线 -->
  <g stroke="#c7d2fe" stroke-width="5" stroke-linecap="round" opacity="0.85">
    <line x1="42" y1="128" x2="66" y2="104"/>
    <line x1="66" y1="104" x2="92" y2="106"/>
    <line x1="92" y1="106" x2="104" y2="84"/>
    <line x1="104" y1="84" x2="126" y2="88"/>
    <line x1="126" y1="88" x2="150" y2="64"/>
  </g>
  <!-- 星点 -->
  <g fill="#ffffff">
    <circle cx="42" cy="128" r="9"/>
    <circle cx="66" cy="104" r="9"/>
    <circle cx="92" cy="106" r="9"/>
    <circle cx="104" cy="84" r="9"/>
    <circle cx="126" cy="88" r="10"/>
    <circle cx="150" cy="64" r="12"/>
  </g>
</svg>
