# opencode zen API 反向代理（OpenAI 兼容）
# 用途：借 racknerd 独立公网 IP (23.94.255.186) 换取 opencode 免费层独立额度
# 用法: base_url = http://192.168.3.1:3005/v1
#   → 璇玑拼出 http://192.168.3.1:3005/v1/chat/completions
#   → location /v1/ 剥离前缀后转发 https://opencode.ai/zen/v1/chat/completions
# key 由客户端自带 Authorization 头，代理仅透传
server {
    listen 3005;
    server_name _;

    allow 192.168.3.0/24;
    allow 192.168.1.0/24;
    allow 127.0.0.1;
    allow ::1;
    deny all;

    proxy_buffering off;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host opencode.ai;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header User-Agent $http_user_agent;
    proxy_set_header x-opencode-client $http_x_opencode_client;
    proxy_set_header x-opencode-session $http_x_opencode_session;
    proxy_set_header x-opencode-project $http_x_opencode_project;
    proxy_ssl_server_name on;
    proxy_connect_timeout 30s;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    location /v1/ {
        proxy_pass https://opencode.ai/zen/v1/;
    }
}
